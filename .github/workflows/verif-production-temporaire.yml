# TEMPORAIRE : contrôle de la production après la mise en ligne de « tous les matchs ». Vit seulement sur une branche jetable.
# Le rapport est écrit dans rapport-verif.txt puis déposé sur la branche (les journaux GitHub ne sont pas lisibles depuis l'assistant).
name: Vérification temporaire de la production

on:
  push:
    branches: [verif-production-temporaire]
    paths:
      - ".github/workflows/verif-production-temporaire.yml"
      - "scripts/verif-europe-temporaire.js"

permissions:
  contents: write

jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrôle de la production
        run: |
          set +e
          node scripts/verif-europe-temporaire.js 2>&1 | tee rapport-verif.txt
          echo "CODE=${PIPESTATUS[0]}" >> rapport-verif.txt
          exit 0
      - name: Déposer le rapport sur la branche
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rapport-verif.txt
          git commit -m "Rapport de contrôle de la production" || true
          git push origin HEAD:verif-production-temporaire
